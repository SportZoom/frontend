<div class="flex min-h-screen items-center justify-center bg-gray-50 text-gray-800">
<!-- Botón volver -->
<a routerLink="/tienda"
class="absolute top-4 right-4 flex items-center gap-2 text-gray-500 hover:text-blue-600 transition text-sm font-medium">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
</svg>
Volver a la tienda
</a>
  <div class="w-full max-w-md bg-white border rounded-2xl shadow-md p-8">

    <a routerLink="/tienda" class="mb-6 block cursor-pointer text-center text-2xl font-bold text-blue-600">SportZoom</a>

    <!-- Pestañas -->
    <div class="flex rounded-xl overflow-hidden border mb-6">
      <button
        (click)="cambiarPestana('cliente')"
        [class.bg-blue-600]="pestanaActiva === 'cliente'"
        [class.text-white]="pestanaActiva === 'cliente'"
        [class.bg-white]="pestanaActiva !== 'cliente'"
        [class.text-gray-600]="pestanaActiva !== 'cliente'"
        class="flex-1 py-2 text-sm font-semibold transition">
        Cliente
      </button>
      <button
        (click)="cambiarPestana('admin')"
        [class.bg-blue-600]="pestanaActiva === 'admin'"
        [class.text-white]="pestanaActiva === 'admin'"
        [class.bg-white]="pestanaActiva !== 'admin'"
        [class.text-gray-600]="pestanaActiva !== 'admin'"
        class="flex-1 py-2 text-sm font-semibold transition border-l">
        Administrador
      </button>
    </div>

    <form (ngSubmit)="iniciarSesion()" class="space-y-4">

      <!-- Formulario Cliente -->
      <ng-container *ngIf="pestanaActiva === 'cliente'">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input type="email" [(ngModel)]="correo" name="correo"
            placeholder="tu@correo.com"
            class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <input [type]="mostrarPasswordCliente ? 'text' : 'password'" [(ngModel)]="passwordCliente" name="passwordCliente"
              placeholder="Tu contraseña"
              class="w-full border border-gray-300 rounded-lg p-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
            <button type="button" (click)="mostrarPasswordCliente = !mostrarPasswordCliente" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-blue-600">
              <svg *ngIf="!mostrarPasswordCliente" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              <svg *ngIf="mostrarPasswordCliente" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
            </button>
          </div>
        </div>
      </ng-container>

      <!-- Formulario Admin -->
      <ng-container *ngIf="pestanaActiva === 'admin'">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <input type="text" [(ngModel)]="username" name="username"
            placeholder="Ingresa tu usuario"
            class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <input [type]="mostrarPasswordAdmin ? 'text' : 'password'" [(ngModel)]="passwordAdmin" name="passwordAdmin"
              placeholder="Ingresa tu contraseña"
              class="w-full border border-gray-300 rounded-lg p-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
            <button type="button" (click)="mostrarPasswordAdmin = !mostrarPasswordAdmin" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-blue-600">
              <svg *ngIf="!mostrarPasswordAdmin" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              <svg *ngIf="mostrarPasswordAdmin" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
            </button>
          </div>
        </div>
      </ng-container>

      <button type="submit" [disabled]="cargando"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50">
        {{ cargando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

      <p class="text-center text-sm text-red-600" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>

    <!-- Solo en pestaña cliente -->
    <p *ngIf="pestanaActiva === 'cliente'" class="text-center text-sm text-gray-500 mt-5">
      ¿No tienes cuenta?
      <a routerLink="/registro" class="text-blue-600 hover:underline font-medium">Regístrate aquí</a>
    </p>

    <div class="mt-6 text-center text-xs text-gray-400 border-t pt-3">
      © 2025 SportZoom
    </div>
  </div>
</div>
