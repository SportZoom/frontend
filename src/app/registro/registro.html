<div class="flex min-h-screen items-center justify-center bg-gray-50 text-gray-800 py-10">
<!-- Botón volver -->
<a routerLink="/tienda"
class="absolute top-4 right-4 flex items-center gap-2 text-gray-500 hover:text-blue-600 transition text-sm font-medium">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
</svg>
Volver a la tienda
</a>
  <div class="w-full max-w-md bg-white border rounded-2xl shadow-md p-8">

    <!-- Cabecera -->
    <h2 class="text-3xl font-bold text-center text-blue-600 mb-2">Crear cuenta</h2>
    <p class="text-center text-gray-500 mb-6 text-sm">Regístrate para guardar tus compras</p>

    <!-- Mensaje de buen registro-->
    <div *ngIf="exitoso"
      class="bg-green-50 border border-green-300 text-green-700 rounded-lg p-3 text-sm text-center mb-4">
       ¡Registro exitoso! Redirigiendo a la tienda...
    </div>

    <form (ngSubmit)="registrar()" class="space-y-5" *ngIf="!exitoso">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Nombre completo <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="nombre" name="nombre" required
          placeholder="Ingresa tu nombre completo"
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
      </div>

      <!-- Correo -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Correo electrónico <span class="text-red-500">*</span>
        </label>
        <input type="email" [(ngModel)]="correo" name="correo" required
          placeholder="tucorreo@ejemplo.com"
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
      </div>

      <!-- Género -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Género <span class="text-red-500">*</span>
        </label>
        <select [(ngModel)]="genero" name="genero" required
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300 transition bg-white">
          <option value="" disabled>Selecciona tu género</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="O">Otro</option>
          <option value="P">Prefiero no decir</option>
        </select>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contraseña <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
            placeholder="Mínimo 8 caracteres"
            class="w-full border border-gray-300 rounded-lg p-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
          <button type="button" (click)="showPassword = !showPassword"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Confirmar contraseña <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmarPassword" name="confirmarPassword" required
            placeholder="Repite tu contraseña"
            class="w-full border border-gray-300 rounded-lg p-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
          <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
            <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Términos y condiciones -->
      <div class="flex items-start gap-2">
        <input type="checkbox" id="terminos" [(ngModel)]="aceptaTerminos" name="aceptaTerminos"
          class="mt-1 accent-blue-600" />
        <label for="terminos" class="text-sm text-gray-600">
          Acepto los
          <a href="#" class="text-blue-600 underline hover:text-blue-800">términos y condiciones</a>
          de tratamiento de datos personales. <span class="text-red-500">*</span>
        </label>
      </div>


      <p class="text-center text-sm text-red-600" *ngIf="errorMsg">{{ errorMsg }}</p>


      <button type="submit" [disabled]="cargando"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50">
        {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
      </button>

    </form>


    <p class="text-center text-sm text-gray-500 mt-5">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-blue-600 font-medium hover:underline">Inicia sesión</a>
    </p>

    <div class="mt-6 text-center text-xs text-gray-400 border-t pt-3">
      © 2025 SportZoom — Tu tienda de calzado
    </div>
  </div>
</div>
