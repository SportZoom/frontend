<div *ngIf="state.open" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 px-4">
  <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-5 shadow-2xl">
    <div class="mb-4 flex items-start gap-3">
      <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-600">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 9v4m0 4h.01M10.3 4.3L2.7 18a2 2 0 001.75 3h15.1a2 2 0 001.75-3L13.7 4.3a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-bold text-gray-900">{{ state.title }}</h2>
        <p class="mt-1 text-sm leading-6 text-gray-600">{{ state.message }}</p>
      </div>
    </div>

    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancel()"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 font-semibold text-gray-700 transition hover:bg-gray-50"
      >
        {{ state.cancelText }}
      </button>
      <button
        type="button"
        (click)="accept()"
        class="rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white shadow-sm transition hover:bg-blue-700"
      >
        {{ state.confirmText }}
      </button>
    </div>
  </div>
</div>
